<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 지구 숙제 🌏</title>
<style>
:root{--g:#2e9e6b;--gd:#1f7a4f;--gl:#e8f7ef;--b:#2f80ed;--bl:#e8f1fe;--t:#22303a;--m:#6b7b86;--line:#dfe8ec;--warn:#e8590c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--t);background:linear-gradient(180deg,#f2fbf6 0,#fff 260px,#fff 100%);min-height:100vh;line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:24px 18px 28px;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
.screen{display:none;animation:fade .35s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:56px 6px 20px}
.hero .em{font-size:76px;line-height:1;margin-bottom:12px}
h1{font-size:32px;margin:8px 0 12px;letter-spacing:-.5px}
h1 span{color:var(--g)}
.hero p{color:var(--m);font-size:17px;margin:0 0 32px}
h2{font-size:22px;margin:8px 0 4px}
.sub{color:var(--m);margin:0 0 18px;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(46,158,107,.07);transition:border-color .2s,box-shadow .2s}
.card.err{border-color:var(--warn);box-shadow:0 0 0 3px rgba(232,89,12,.15);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card h3{margin:0 0 12px;font-size:17px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{font:inherit;font-size:16px;font-weight:600;padding:15px 8px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--t);cursor:pointer;min-height:56px;transition:transform .12s,background .15s,border-color .15s}
.opt:hover{border-color:var(--g);background:var(--gl)}
.opt:active{transform:scale(.95)}
.opt.sel{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 4px 12px rgba(46,158,107,.35)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.big{text-align:center;font-size:54px;font-weight:800;color:var(--b);line-height:1.1}
.big small{font-size:20px;font-weight:700;margin-left:4px}
input[type=range]{width:100%;height:36px;margin:10px 0 0;accent-color:var(--b)}
.scale{display:flex;justify-content:space-between;color:var(--m);font-size:13px}
.btn{font:inherit;font-size:19px;font-weight:700;width:100%;padding:17px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--g),#26a69a);color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(46,158,107,.35);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.line{background:#fff;color:var(--b);border:2px solid var(--b);box-shadow:none;margin-top:6px}
.warn{display:none;background:#fff4ec;color:var(--warn);border:1px solid #ffd2b8;border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:600;font-size:15px}
.warn.on{display:block}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog i{flex:1;height:6px;border-radius:6px;background:var(--line);transition:background .2s}
.prog i.on{background:var(--g)}
.intro{background:var(--gl);border-radius:20px;padding:16px 18px;margin-bottom:16px;font-size:16px;font-weight:600}
.act{position:relative}
.badge{display:inline-block;background:var(--bl);color:var(--b);font-weight:700;font-size:13px;border-radius:99px;padding:3px 11px;margin-bottom:8px}
.act h3{font-size:18px;margin:0 0 8px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.meta span{background:var(--gl);color:var(--gd);font-size:13px;font-weight:700;border-radius:10px;padding:3px 10px}
.act p{margin:0;color:#41525d;font-size:15px}
.no{position:absolute;top:14px;right:16px;font-size:26px;font-weight:800;color:#cfe3d8}
.note{background:#fffbe8;border:1px solid #f3e3a1;border-radius:20px;padding:16px 18px;margin:6px 0 16px}
.note h3{margin:0 0 8px;font-size:17px}
.note ul{margin:0;padding-left:20px}
.note li{margin-bottom:4px;font-size:15px}
footer{text-align:center;color:#9aa8b1;font-size:12px;padding-top:24px}
@media(min-width:700px){.wrap{padding-top:48px}.card,.intro{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
<main>
<section id="s-start" class="screen on">
  <div class="hero">
    <div class="em">🌏</div>
    <h1>오늘의 지구 <span>숙제</span> 🌏</h1>
    <p>관심사와 시간, 예산만 골라 보세요.<br>오늘 내 상황에서 바로 할 수 있는<br>SDGs 실천 행동 3가지를 추천해 드려요.</p>
    <button class="btn" id="startBtn">시작하기 🌱</button>
  </div>
</section>

<section id="s-form" class="screen">
  <h2>나에게 맞는 SDGs 실천 방법</h2>
  <p class="sub">5가지만 골라 주세요. 금방 끝나요!</p>
  <div class="prog" id="prog"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="warn" id="warn" role="alert"></div>

  <div class="card" data-key="cat"><h3>1. 어떤 분야에 관심 있어요?</h3>
    <div class="opts" id="o-cat"></div></div>

  <div class="card" data-key="time"><h3>2. 오늘 쓸 수 있는 시간은요?</h3>
    <div class="big"><span id="timeVal">30</span><small>분</small></div>
    <input type="range" id="time" min="5" max="120" step="5" value="30" aria-label="쓸 수 있는 시간(분)">
    <div class="scale"><span>5분</span><span>120분</span></div></div>

  <div class="card" data-key="budget"><h3>3. 예산은 얼마까지 괜찮아요?</h3>
    <div class="opts three" id="o-budget"></div></div>

  <div class="card" data-key="place"><h3>4. 지금 어디에 있어요?</h3>
    <div class="opts three" id="o-place"></div></div>

  <div class="card" data-key="who"><h3>5. 누구와 함께해요?</h3>
    <div class="opts three" id="o-who"></div></div>

  <button class="btn" id="goBtn">추천받기 ✨</button>
</section>

<section id="s-result" class="screen">
  <h2>오늘의 숙제가 도착했어요 🎉</h2>
  <div class="intro" id="intro"></div>
  <div id="acts"></div>
  <div class="note"><h3>⚠️ 꼭 고려할 점</h3><ul id="notes"></ul></div>
  <button class="btn" id="retryBtn">다시 골라보기 🔄</button>
</section>
</main>
<footer>Web:메이커스 1기 · 김경준</footer>
</div>

var st={cat:null,budget:null,place:null,who:null};
var $=function(i){return document.getElementById(i)};
function show(id){["s-start","s-form","s-result"].forEach(function(s){$(s).classList.toggle("on",s===id)});window.scrollTo(0,0)}
function build(id,list,key,numeric){
  var box=$(id);box.innerHTML="";
  list.forEach(function(it){
    var b=document.createElement("button");b.type="button";b.className="opt";b.textContent=it[1];b.setAttribute("aria-pressed","false");
    b.onclick=function(){
      st[key]=it[0];
      [].forEach.call(box.children,function(c){c.classList.remove("sel");c.setAttribute("aria-pressed","false")});
      b.classList.add("sel");b.setAttribute("aria-pressed","true");
      box.parentNode.classList.remove("err");updateProg();
    };
    box.appendChild(b);
  });
}
function updateProg(){
  var n=0,ks=["cat","budget","place","who"];ks.forEach(function(k){if(st[k]!==null)n++});
  var bars=$("prog").children;for(var i=0;i<5;i++)bars[i].classList.toggle("on",i<n+1);
  if(n===4)$("warn").classList.remove("on");
}
build("o-cat",CATS,"cat");build("o-budget",BUDGETS,"budget");build("o-place",PLACES,"place");build("o-who",WHO,"who");
$("time").addEventListener("input",function(){$("timeVal").textContent=this.value});
$("startBtn").onclick=function(){show("s-form")};
$("goBtn").onclick=function(){
  var names={cat:"관심 분야",budget:"예산",place:"장소",who:"함께하는 사람"},miss=[];
  document.querySelectorAll(".card.err").forEach(function(c){c.classList.remove("err")});
  Object.keys(names).forEach(function(k){if(st[k]===null){miss.push(names[k]);document.querySelector('[data-key="'+k+'"]').classList.add("err")}});
  var w=$("warn");
  if(miss.length){
    w.textContent="아직 "+miss.join(", ")+" 항목을 고르지 않았어요. 선택하면 바로 추천해 드릴게요! 👆";
    w.classList.add("on");
    document.querySelector(".card.err").scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  w.classList.remove("on");render();show("s-result");
};
$("retryBtn").onclick=function(){
  st={cat:null,budget:null,place:null,who:null};
  document.querySelectorAll(".opt.sel").forEach(function(b){b.classList.remove("sel");b.setAttribute("aria-pressed","false")});
  $("time").value=30;$("timeVal").textContent="30";updateProg();show("s-form");
};
function fmtCost(c){return c===0?"무료":"약 "+(c/10000)+"만원 이하"}
function recommend(){
  var time=+$("time").value;
  var pool=DB.filter(function(a){return a[3]<=time&&a[4]<=st.budget});
  var scored=pool.map(function(a,i){
    var s=0;
    if(a[0]===st.cat)s+=10;
    if(a[5].indexOf(st.place)>=0)s+=4;
    if(a[6].indexOf(st.who)>=0)s+=3;
    s+=Math.min(a[3]/time,1)*2; // 시간을 알차게 쓰는 행동 가산
    s+=Math.random()*1.5; // 같은 조건이라도 매번 조금씩 다른 조합
    return {a:a,s:s};
  }).sort(function(x,y){return y.s-x.s});
  var pick=[],sdgs={};
  // 서로 다른 SDG를 우선
  scored.forEach(function(o){if(pick.length<3&&!sdgs[o.a[1]]){pick.push(o);sdgs[o.a[1]]=1}});
  scored.forEach(function(o){if(pick.length<3&&pick.indexOf(o)<0)pick.push(o)});
  return pick.map(function(o){return o.a});
}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function render(){
  var picks=recommend(),time=+$("time").value;
  var catName=CATS.filter(function(c){return c[0]===st.cat})[0][1];
  var bud=BUDGETS.filter(function(b){return b[0]===st.budget})[0][1];
  $("intro").innerHTML="📣 "+esc(PL[st.place])+"에서 "+esc(WL[st.who])+" 하는 "+time+"분, 예산 "+esc(bud)+" 조건이네요! <b>"+esc(catName.replace(/^\S+\s/,""))+"</b> 분야로 오늘 바로 할 수 있는 행동을 골라 봤어요. 하나만 해도 충분히 멋져요!";
  var html="";
  picks.forEach(function(a,i){
    var reasons=[a[7]];
    if(a[0]!==st.cat)reasons.push("고르신 분야에서 조건에 맞는 행동이 부족해서 비슷한 가치를 가진 행동을 함께 골랐어요.");
    if(a[5].indexOf(st.place)>=0)reasons.push(PL[st.place]+"에서 바로 시작할 수 있어요.");
    if(a[6].indexOf(st.who)>=0)reasons.push(WL[st.who]+" 하기에도 잘 어울려요.");
    html+='<div class="card act"><span class="no">'+(i+1)+'</span><span class="badge">SDG '+a[1]+' · '+esc(SDG[a[1]])+'</span><h3>'+esc(a[2])+'</h3><div class="meta"><span>⏱ 약 '+a[3]+'분</span><span>💰 '+fmtCost(a[4])+'</span></div><p>💡 <b>추천 이유</b> · '+esc(reasons.join(" "))+'</p></div>';
  });
  $("acts").innerHTML=html;
  var notes=picks.slice(0,2).map(function(a){return "<li>"+esc(a[8])+"</li>"});
  $("notes").innerHTML=notes.join("");
}
})();
